name: Release

# Push a tag like v1.0.0 to build a release APK and publish it on the Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add the repository secrets HUESHIFT_KEYSTORE_BASE64, HUESHIFT_KEYSTORE_PASSWORD,
      # HUESHIFT_KEY_ALIAS and HUESHIFT_KEY_PASSWORD to sign releases with your own key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HUESHIFT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "HUESHIFT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key configured: the APK is signed with a temporary debug key."
          fi

      - name: Build release APK
        env:
          HUESHIFT_KEYSTORE_PASSWORD: ${{ secrets.HUESHIFT_KEYSTORE_PASSWORD }}
          HUESHIFT_KEY_ALIAS: ${{ secrets.HUESHIFT_KEY_ALIAS }}
          HUESHIFT_KEY_PASSWORD: ${{ secrets.HUESHIFT_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "hue-shift-${GITHUB_REF_NAME//\//-}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hue-shift-release-apk
          path: hue-shift-*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" hue-shift-*.apk \
            --title "hue-shift $GITHUB_REF_NAME" \
            --generate-notes
