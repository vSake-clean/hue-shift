name: Release

# Publishes a release APK on the Releases page. Either push a tag like v1.0.0, or run this
# workflow by hand (Actions → Release → Run workflow) and enter the version to publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. v1.0.0 (leave empty to only build the APK)
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add the repository secrets HUESHIFT_KEYSTORE_BASE64, HUESHIFT_KEYSTORE_PASSWORD,
      # HUESHIFT_KEY_ALIAS and HUESHIFT_KEY_PASSWORD to sign releases with your own key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HUESHIFT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "HUESHIFT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key configured: the APK is signed with a temporary debug key."
          fi

      - name: Build release APK
        env:
          HUESHIFT_KEYSTORE_PASSWORD: ${{ secrets.HUESHIFT_KEYSTORE_PASSWORD }}
          HUESHIFT_KEY_ALIAS: ${{ secrets.HUESHIFT_KEY_ALIAS }}
          HUESHIFT_KEY_PASSWORD: ${{ secrets.HUESHIFT_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "hue-shift-${VERSION:-${GITHUB_SHA::7}}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hue-shift-release-apk
          path: hue-shift-*.apk
          if-no-files-found: error

      - name: Publish release
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" hue-shift-*.apk \
            --target "$GITHUB_SHA" \
            --title "hue-shift $VERSION" \
            --notes "Pobierz plik APK poniżej i otwórz go na telefonie (Android 8.0+). Instrukcja konfiguracji: [README](https://github.com/$GITHUB_REPOSITORY#readme).
          Download the APK below and open it on your phone (Android 8.0+). Setup guide: [README (English)](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/README.en.md)." \
            --generate-notes
